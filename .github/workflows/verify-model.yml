name: Verify model build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'model/**'
      - 'tools/**'
      - 'data/blocks.json'
      - 'data/source/**'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install openpyxl pytest

      - name: Check for required files
        id: guard
        run: |
          has_script_tool=false
          [ -f tools/model_script_to_json.py ] && has_script_tool=true
          has_groovy=false
          ls data/source/*.groovy >/dev/null 2>&1 && has_groovy=true
          has_xlsx_tool=false
          [ -f tools/xlsx_to_json.py ] && has_xlsx_tool=true
          has_model_json=false
          [ -f data/model.json ] && has_model_json=true
          has_source_xlsx=false
          ls data/source/*.xlsx >/dev/null 2>&1 && has_source_xlsx=true
          has_build_car=false
          [ -f model/build_car.py ] && has_build_car=true
          has_validate=false
          [ -f tools/validate_glb.py ] && has_validate=true
          has_report=false
          [ -f dist/build-report.json ] && has_report=true

          echo "has_script_tool=$has_script_tool" >> "$GITHUB_OUTPUT"
          echo "has_groovy=$has_groovy" >> "$GITHUB_OUTPUT"
          echo "has_xlsx_tool=$has_xlsx_tool" >> "$GITHUB_OUTPUT"
          echo "has_model_json=$has_model_json" >> "$GITHUB_OUTPUT"
          echo "has_source_xlsx=$has_source_xlsx" >> "$GITHUB_OUTPUT"
          echo "has_build_car=$has_build_car" >> "$GITHUB_OUTPUT"
          echo "has_validate=$has_validate" >> "$GITHUB_OUTPUT"
          echo "has_report=$has_report" >> "$GITHUB_OUTPUT"

          if [ "$has_script_tool" = false ] || [ "$has_groovy" = false ] || [ "$has_model_json" = false ] || [ "$has_source_xlsx" = false ]; then
            echo "::notice::Skipping model-script reproducibility check: tools/model_script_to_json.py, data/source/*.groovy, data/source/*.xlsx, or data/model.json is not present yet."
          fi
          if [ "$has_build_car" = false ]; then
            echo "::notice::Skipping Blender build and downstream checks: model/build_car.py is not present yet."
          fi
          if [ "$has_validate" = false ]; then
            echo "::notice::Skipping glb contract validation: tools/validate_glb.py is not present yet."
          fi
          if [ "$has_report" = false ]; then
            echo "::notice::Skipping build-report comparison: dist/build-report.json is not present yet."
          fi

      - name: Regenerate model.json (from the model script) and diff against committed copy
        if: steps.guard.outputs.has_script_tool == 'true' && steps.guard.outputs.has_groovy == 'true' && steps.guard.outputs.has_model_json == 'true' && steps.guard.outputs.has_source_xlsx == 'true'
        run: |
          python tools/model_script_to_json.py data/source/*.groovy data/blocks.json data/source/*.xlsx /tmp/model.json
          diff data/model.json /tmp/model.json

      - name: Cross-check model_script_to_json.py against xlsx_to_json.py
        if: steps.guard.outputs.has_script_tool == 'true' && steps.guard.outputs.has_groovy == 'true' && steps.guard.outputs.has_xlsx_tool == 'true' && steps.guard.outputs.has_source_xlsx == 'true'
        run: |
          python tools/xlsx_to_json.py data/source/*.xlsx data/blocks.json /tmp/model.xlsx.json
          python - <<'PY'
          import json

          ADDITIVE_ELEMENT_KEYS = {"role", "subParts", "operations", "receptions", "values", "ports"}
          ADDITIVE_TOP_LEVEL_KEYS = {"behavior", "parametrics", "signals", "composition"}
          SECTION6_STATS_KEYS = {"stateMachines", "activities", "interactions", "parametrics", "signals", "subParts"}

          def strip_additive(model):
              stripped = {k: v for k, v in model.items() if k not in ADDITIVE_TOP_LEVEL_KEYS}
              stripped["elements"] = [
                  {k: v for k, v in el.items() if k not in ADDITIVE_ELEMENT_KEYS} for el in model["elements"]
              ]
              stripped["stats"] = {k: v for k, v in model["stats"].items() if k not in SECTION6_STATS_KEYS}
              return stripped

          with open("/tmp/model.json") as f:
              script_model = json.load(f)
          with open("/tmp/model.xlsx.json") as f:
              xlsx_model = json.load(f)

          stripped_script = strip_additive(script_model)
          stripped_xlsx = strip_additive(xlsx_model)
          for key in ("categories", "flows", "hierarchy", "relationships"):
              assert stripped_script[key] == stripped_xlsx[key], key
          assert stripped_script["stats"] == stripped_xlsx["stats"]
          xlsx_by_id = {e["id"]: e for e in stripped_xlsx["elements"]}
          script_by_id = {e["id"]: e for e in stripped_script["elements"]}
          missing = set(xlsx_by_id) - set(script_by_id)
          assert not missing, f"missing elements: {sorted(missing)}"
          mismatched = [eid for eid, el in xlsx_by_id.items() if script_by_id[eid] != el]
          assert not mismatched, f"mismatched elements: {sorted(mismatched)}"
          print("model_script_to_json.py is a superset of xlsx_to_json.py's output.")
          PY

      - name: Cache Blender
        if: steps.guard.outputs.has_build_car == 'true'
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender
          key: blender-5.2.1-linux-x64

      - name: Download Blender
        if: steps.guard.outputs.has_build_car == 'true' && steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fL -o /tmp/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
          tar -xJf /tmp/blender.tar.xz -C "$RUNNER_TEMP/blender" --strip-components=1

      - name: Install Blender runtime dependencies
        if: steps.guard.outputs.has_build_car == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6

      - name: Build car.glb with Blender
        if: steps.guard.outputs.has_build_car == 'true'
        run: |
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-exit-code 1 --python model/build_car.py -- --data data/model.json --blocks data/blocks.json --out /tmp/car.glb --report /tmp/build-report.json

      - name: Validate glb contract
        if: steps.guard.outputs.has_build_car == 'true' && steps.guard.outputs.has_validate == 'true'
        run: python tools/validate_glb.py /tmp/car.glb data/model.json data/blocks.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare build report against committed copy
        if: steps.guard.outputs.has_build_car == 'true' && steps.guard.outputs.has_report == 'true'
        run: |
          python - <<'PY'
          import json
          import sys

          with open("/tmp/build-report.json") as f:
              got = json.load(f)
          with open("dist/build-report.json") as f:
              want = json.load(f)

          if got != want:
              print("build-report.json differs from committed dist/build-report.json")
              sys.exit(1)

          print("build-report.json matches committed dist/build-report.json")
          PY

      - name: Upload car.glb artifact
        if: steps.guard.outputs.has_build_car == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: car-glb
          path: /tmp/car.glb
          if-no-files-found: ignore
