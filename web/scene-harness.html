<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene harness - SysML Car viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* Standalone page: no toolbar, no panel, just the viewport. */
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      #harness-viewport {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }
      #harness-bar {
        flex: 0 0 auto;
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 6px 12px;
        border-top: 1px solid var(--color-border);
        background: var(--color-panel);
        font: 12px/1.4 var(--font-mono);
        color: var(--color-muted);
      }
      #harness-log {
        color: var(--color-text);
      }
    </style>
  </head>
  <body>
    <div id="harness-viewport" data-testid="harness-viewport"></div>
    <div id="harness-bar">
      <span>1-9 select &middot; 0 clear &middot; x x-ray &middot; e/E explode &middot; f focus &middot; r rotate &middot; t theme</span>
      <span id="harness-log" data-testid="harness-log">starting&hellip;</span>
    </div>
    <script type="module" src="/src/scene/dev-harness.ts"></script>
  </body>
</html>
